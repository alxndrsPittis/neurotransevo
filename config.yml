# Pipeline configuration.
#
# Relative paths are resolved against the repository root. To point the
# pipeline at data stored elsewhere, do NOT edit this file: copy
# config.local.yml.example to config.local.yml (git-ignored) and override
# only the keys you need. Environment variables of the form
# NEUROTRANSEVO_<KEY> (e.g. NEUROTRANSEVO_SINGLECELL) override both files.

paths:
  # Public single-cell datasets, one sub-directory per study (see data/README.md).
  singlecell: data/singlecell
  # eggNOG-mapper annotation tables, one per species (see data/README.md).
  eggnog: data/eggnog
  # Curated neurotransmission gene-family members (committed).
  families: data/families/neurotrans_family_members.melted.list
  # Identifier mapping tables (committed).
  mappings: data/mappings
  # UniProt reference proteomes used for identifier mapping (downloaded).
  proteomes: data/proteomes
  # Boltz-2 affinity table (committed) and, optionally, raw Boltz-2 outputs.
  boltz_table: data/boltz2/boltz_affinities_v2.csv
  boltz_predictions: data/boltz2/boltz_predictions_full.csv
  boltz_raw: data/boltz2/raw
  # Everything the pipeline writes.
  results: results

coregulon:
  r_min: 0.5          # Pearson r threshold
  padj_max: 0.05      # Benjamini-Hochberg adjusted p-value threshold
  go_term: "GO:0009308"  # amine metabolic process
  seed_families: [Acetyltransf, Biopterin_H, Pyridoxal-AADC, DOMON_clade,
                  P450-CYP2D6_clade, SLC18, SLC5, SNF_clade]
  seed_fallback: {SNF_clade: SNF}   # used when a species has no SNF_clade members
